name: Blip lives

on:
  schedule:
    - cron: "17 * * * *"    # wander: every hour at :17 (UTC)
    - cron: "48 22 * * *"   # diary: every night at 22:48 UTC
  workflow_dispatch:         # lets you press "Run workflow" by hand
    inputs:
      command:
        description: "What time is it for Blip? (Blip decides everything else itself)"
        type: choice
        options:
          - "a new hour (Blip chooses what to do)"
          - "end of the day (diary, self-reflection, website)"
          - "website only (redecorate and tend spaces)"
          - "maintenance: test internet sources (no thinking)"
        default: "a new hour (Blip chooses what to do)"
      alert_at:
        description: "Email me about finds scoring at least this (0-10). Leave as 9."
        default: "9"

permissions:
  contents: write            # so it can save memory.json and creations back to the repo
  issues: write              # so it can open an issue (= email to you) about amazing finds

concurrency:
  group: blip                # never run two at once (they'd fight over memory.json)
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BLIP_MODEL: gemma3:4b
      BLIP_CONTACT: ${{ vars.BLIP_CONTACT }}
      BLIP_ALERT_AT: ${{ inputs.alert_at || '9' }}
      OLLAMA_MODELS: /home/runner/ollama-models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Restore the brain from cache
        uses: actions/cache@v4
        with:
          path: /home/runner/ollama-models
          key: ollama-models-${{ env.BLIP_MODEL }}

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true   # we start our own copy below

      - name: Wake up the brain
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434 && break; sleep 2; done
          ollama pull "$BLIP_MODEL"

      - name: Decide what to do
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.command }}" in
              "a new hour"*|wander) echo "cmd=wander" >> "$GITHUB_OUTPUT" ;;
              "end of the day"*|diary) echo "cmd=diary" >> "$GITHUB_OUTPUT" ;;
              "website only"*|home) echo "cmd=home" >> "$GITHUB_OUTPUT" ;;
              "maintenance"*|check) echo "cmd=check" >> "$GITHUB_OUTPUT" ;;
              *) echo "cmd=wander" >> "$GITHUB_OUTPUT" ;;
            esac
          elif [ "${{ github.event.schedule }}" = "48 22 * * *" ]; then
            echo "cmd=diary" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=wander" >> "$GITHUB_OUTPUT"
          fi

      - name: Blip does its thing
        env:
          GH_TOKEN: ${{ github.token }}   # lets Blip read its human's replies and answer them
        run: python creature.py ${{ steps.pick.outputs.cmd }}

      - name: Save memory
        run: |
          git config user.name "blip-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory.json
          if [ -d creations ]; then git add creations; fi
          if git diff --cached --quiet; then
            echo "Nothing new to remember."
            exit 0
          fi
          git commit -m "Blip: ${{ steps.pick.outputs.cmd }} $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

      - name: Tell my human (amazing finds and new creations)
        if: hashFiles('notify.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' notify.json | while read -r note; do
            gh issue create --assignee "${{ github.repository_owner }}" --title "$(jq -r .title <<<"$note")" --body "$(jq -r .body <<<"$note")"
          done

      - name: Brain health (errors from Ollama, if any)
        if: always()
        run: grep -iE "error|panic|fatal|out of memory" /tmp/ollama.log | tail -n 30 || echo "No brain errors."
